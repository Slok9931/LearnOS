[tool]
name = "LearnOS Simulator"
version = "1.0.0"
description = "API for the OS Simulator"
authors = ["SLOK TULSYAN <sloktulsyan@gmail.com>"]
license = "MIT"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.100"
uvicorn = "*"
pydantic = "^2.0"

[tool.poetry.dev-dependencies]
pytest = ">=7"
httpx = "*"

[tool.poetry.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"